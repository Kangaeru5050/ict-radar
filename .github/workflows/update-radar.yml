name: Update ICT Radar

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/sources.json'
      - 'scripts/update_radar.py'
      - '.github/workflows/update-radar.yml'
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect RSS radar
        run: python scripts/update_radar.py
      - name: Commit changed radar data
        run: |
          if git diff --quiet data/radar.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "ict-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/radar.json
          git commit -m "Update ICT radar feed"
          git push
