name: Watch Security Sources

on:
  workflow_dispatch:
  schedule:
    - cron: '05 22 * * *'
  push:
    paths:
      - 'data/security-watch.json'
      - 'scripts/check_security_sources.py'
      - '.github/workflows/watch-security.yml'

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check reviewed security sources
        run: python scripts/check_security_sources.py
      - name: Commit watch state
        run: |
          if git diff --quiet data/security-watch.json; then
            echo "No watch state changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/security-watch.json
          git commit -m "Update security source watch"
          git pull --rebase origin main
          git push
